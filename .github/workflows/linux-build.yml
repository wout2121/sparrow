name: Build Linux (alle distro's)

# Bouwt Sparrow voor Linux op x86_64 en aarch64 (arm64, o.a. Raspberry Pi 4/5 met 64-bit OS):
#   - .deb       Debian, Ubuntu, Linux Mint, Pop!_OS, Zorin OS, Raspberry Pi OS, ...
#   - .rpm       Fedora, RHEL, Rocky/Alma, openSUSE, ...
#   - .AppImage  elke distro (Arch, Manjaro, Void, Gentoo, ...) zonder installatie
#   - .tar.gz    elke distro, handmatig uitpakken
# Plus een headless "Sparrow Server" (.deb/.rpm/.tar.gz) voor servers zonder desktop.

on:
  push:
    branches: [ "master", "visual-easier-with-colors" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JDK_JAVAC_OPTIONS: '-Xlint:-module'

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot zstd xz-utils binutils file libfuse2

      - name: Grant execute permission
        run: chmod +x gradlew repackage.sh scripts/build-appimage.sh

      # jpackage wist build/jpackage bij elke run, dus na elke stap meteen kopiëren naar dist/
      # ---------- Desktop ----------
      - name: Build .deb
        run: |
          mkdir -p dist
          ./gradlew jpackage -PlinuxInstallerType=deb
          ./repackage.sh
          cp build/jpackage/*.deb dist/

      - name: Build .rpm
        run: |
          ./gradlew jpackage -PlinuxInstallerType=rpm
          cp build/jpackage/*.rpm dist/

      - name: Build .tar.gz
        run: |
          ./gradlew packageTarDistribution
          cp build/jpackage/*.tar.gz dist/

      - name: Build .AppImage
        run: |
          ./scripts/build-appimage.sh
          cp build/jpackage/*.AppImage dist/

      # ---------- Headless server ----------
      - name: Headless .deb
        run: |
          ./gradlew -Djava.awt.headless=true clean jpackage -PlinuxInstallerType=deb
          ./repackage.sh
          cp build/jpackage/*.deb dist/

      - name: Headless .rpm
        run: |
          ./gradlew -Djava.awt.headless=true jpackage -PlinuxInstallerType=rpm
          cp build/jpackage/*.rpm dist/

      - name: Headless .tar.gz
        run: |
          ./gradlew -Djava.awt.headless=true packageTarDistribution
          cp build/jpackage/*.tar.gz dist/

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS-${{ matrix.arch }}.txt
          cat SHA256SUMS-${{ matrix.arch }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sparrow-${{ github.ref_name }}-Linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
